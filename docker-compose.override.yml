# Только для локальной разработки. Compose подхватывает этот файл автоматически.
# НЕ использовать на сервере: здесь порты api и db открываются на 127.0.0.1,
# чтобы можно было ходить в API и psql с хост-машины во время разработки.

services:
  api:
    ports:
      - "127.0.0.1:8500:8000"
    environment:
      # Каталог /maps отдаёт адреса тайлов Martin напрямую (как в стилях,
      # опубликованных publish_styles.sh v1 http://localhost:3000).
      TILES_PUBLIC_URL: http://localhost:3000
      # Приложение в деве ходит в API напрямую (:8500), без nginx — файлы
      # регионов API отдаёт сам.
      REGION_FILES_VIA_NGINX: "false"

  worker:
    environment:
      TILES_PUBLIC_URL: http://localhost:3000

  db:
    ports:
      - "127.0.0.1:5433:5432"

  # Тайлы напрямую из Martin по HTTP — чтобы смотреть карту с телефона
  # (adb reverse tcp:3000 tcp:3000) без TLS/allow-list. В проде тайлы идут
  # только через nginx :443.
  martin:
    ports:
      - "127.0.0.1:3000:3000"
