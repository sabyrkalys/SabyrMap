name: Flutter build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      # Every CI build must be signed with the same debug key, otherwise the
      # phone refuses to install a new APK over the previous one and the
      # app's local data is lost to an uninstall. Caching ~/.android still
      # produced a different key per build, so the key is now created here at
      # a fixed path, cached, and handed to Gradle via DEBUG_KEYSTORE. Its
      # SHA-256 is printed so builds can be compared. Not committed: the repo
      # is public.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/ci-debug-keystore
          key: android-debug-keystore-v2

      - name: Create debug signing key if missing
        run: |
          mkdir -p "$HOME/ci-debug-keystore"
          KS="$HOME/ci-debug-keystore/debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -storepass android | grep "SHA256:"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8500

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
